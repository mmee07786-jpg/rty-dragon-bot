<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItzF18 Bot - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: #0f1015;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Navbar */
        nav {
            width: 100%;
            background: #16181d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222630;
        }
        .logo { font-size: 20px; font-weight: bold; color: #5865F2; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .btn-nav {
            background: #23272a;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            border: 1px solid #2f3136;
        }
        .btn-nav:hover { background: #2f3136; }
        .btn-discord {
            background: #5865F2;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }
        .btn-discord:hover { background: #4752c4; }

        /* Container */
        .container { max-width: 700px; width: 100%; padding: 30px 20px; }
        .header-title { font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        .header-sub { font-size: 13px; color: #a3a6ad; margin-bottom: 25px; }

        /* Sections */
        .card {
            background: #16181d;
            border: 1px solid #222630;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 { font-size: 16px; margin-bottom: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 12px; color: #b9bbbe; margin-top: 12px; margin-bottom: 5px; font-weight: 600; }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2f3136;
            background: #0f1015;
            color: #fff;
            font-size: 13px;
        }
        select:focus, input:focus { border-color: #5865F2; outline: none; }

        .btn-save {
            width: 100%;
            background: #5865F2;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-save:hover { background: #4752c4; }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <nav>
        <div class="logo">⚡ ItzF18 Dashboard</div>
        <div class="nav-links">
            <a href="https://discord.com/api/oauth2/authorize?client_id=YOUR_CLIENT_ID&permissions=8&scope=bot" target="_blank" class="btn-nav">🤖 دعوة البوت</a>
            <a href="#commands" class="btn-nav">📜 الأوامر</a>
            <a href="#" onclick="loginDiscord()" class="btn-nav btn-discord">
                <svg width="16" height="16" viewBox="0 0 127.14 96.36" fill="currentColor"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.79,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.81,11.1,105.25,105.25,0,0,0,32.25-16.15c2.62-27.28-4.52-51.2-19.49-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/></svg>
                تسجيل الدخول
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header-title">إعدادات السيرفر</div>
        <div class="header-sub">تحكم بأنظمة البوت (الترحيب، البوست، والتكت) وربطها بسيرفرك مباشرة.</div>

        <!-- اختيار السيرفر -->
        <div class="card">
            <h3>🌐 اختر السيرفر</h3>
            <label>السيرفرات المتاحة:</label>
            <select id="serverSelect">
                <option value="">-- قم بتسجيل الدخول لعرض سيرفراتك --</option>
            </select>
        </div>

        <!-- نظام الترحيب -->
        <div class="card">
            <h3>👋 نظام الترحيب (Welcome)</h3>
            <label>روم الترحيب:</label>
            <select id="welcomeChannel">
                <option value="">اختر الروم...</option>
            </select>
            <label>نص رسالة الترحيب:</label>
            <input type="text" id="welcomeMsg" value="أهلاً بك يا {user} في سيرفر {server}">
        </div>

        <!-- نظام البوست -->
        <div class="card">
            <h3>🚀 نظام البوست (Boost)</h3>
            <label>روم إعلانات البوست:</label>
            <select id="boostChannel">
                <option value="">اختر الروم...</option>
            </select>
            <label>نص رسالة الشكر:</label>
            <input type="text" id="boostMsg" value="شكراً لدعمك السيرفر يا {user}! 🚀">
        </div>

        <!-- نظام التكت -->
        <div class="card">
            <h3>🎫 نظام التكت (Tickets)</h3>
            <label>روم إرسال بانل التكت:</label>
            <select id="ticketChannel">
                <option value="">اختر الروم...</option>
            </select>
            <label>تصنيف فتح رومات التكت (Category):</label>
            <select id="ticketCategory">
                <option value="">اختر التصنيف...</option>
            </select>
        </div>

        <button onclick="saveSettings()" class="btn-save">حفظ التغييرات وتطبيقها على البوت 💾</button>
    </div>

    <script>
        function loginDiscord() {
            alert("🔐 | سيتم توجيهك لتسجيل الدخول عبر حساب ديسكورد قريباً.");
        }

        function saveSettings() {
            const server = document.getElementById('serverSelect').value;
            if (!server) {
                alert('❌ | يرجى اختيار السيرفر أولاً!');
                return;
            }
            alert('✅ | تم حفظ الإعدادات بنجاح وإرسالها للبوت!');
        }
    </script>
</body>
</html>
